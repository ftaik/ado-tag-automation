name: Remove OT-approved before sprint start

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Apply updates (false = dry run)
        required: true
        type: boolean
        default: false

  schedule:
    - cron: "0 4 * * *"

jobs:
  cleanup-ot-approved:
    runs-on: ubuntu-latest

    env:
            ADO_ORG: "${{ secrets.ADO_ORG }}"
            ADO_PROJECT: "${{ secrets.ADO_PROJECT }}"
            ADO_TEAMS: "${{ secrets.ADO_TEAMS }}"
            ADO_PAT: "${{ secrets.ADO_PAT }}"
            TARGET_TAG: "${{ secrets.TARGET_TAG }}"
            TIMEZONE_ID: "${{ secrets.TIMEZONE_ID }}"

    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ADO_ORG)) {
              throw "Missing secret ADO_ORG"
          }

          if ([string]::IsNullOrWhiteSpace($env:ADO_PROJECT)) {
              throw "Missing secret ADO_PROJECT"
          }

          if ([string]::IsNullOrWhiteSpace($env:ADO_TEAMS)) {
              throw "Missing secret ADO_TEAMS"
          }

          if ([string]::IsNullOrWhiteSpace($env:ADO_PAT)) {
              throw "Missing secret ADO_PAT"
          }

          if ([string]::IsNullOrWhiteSpace($env:TARGET_TAG)) {
              $env:TARGET_TAG = "OT-approved"
          }

          if ([string]::IsNullOrWhiteSpace($env:TIMEZONE_ID)) {
              $env:TIMEZONE_ID = "UTC"
          }

      - name: Find tomorrow iterations and clean tag
        shell: pwsh
        env:
                    APPLY_CHANGES: "${{ inputs.apply_changes }}"
        run: |
          $ErrorActionPreference = "Stop"

          function Get-TimeContext {
              param(
                  [string]$TimezoneId
              )

              $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById($TimezoneId)
              $nowUtc = [DateTime]::UtcNow
              $localNow = [System.TimeZoneInfo]::ConvertTimeFromUtc($nowUtc, $tz)
              $tomorrow = $localNow.Date.AddDays(1)

              return @{
                  LocalNow     = $localNow
                  TomorrowDate = $tomorrow
              }
          }

          function Invoke-AdoApi {
              param(
                  [string]$Method,
                  [string]$Url,
                  [object]$Body = $null
              )

              $basic = [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes(":$env:ADO_PAT")
              )

              $headers = @{
                  Authorization = "Basic $basic"
              }

              if ($null -ne $Body) {
                  return Invoke-RestMethod `
                      -Method $Method `
                      -Uri $Url `
                      -Headers $headers `
                      -ContentType "application/json" `
                      -Body ($Body | ConvertTo-Json -Depth 20)
              }

              return Invoke-RestMethod `
                  -Method $Method `
                  -Uri $Url `
                  -Headers $headers
          }

          function Get-ConfiguredTeams {
              param(
                  [string]$RawTeams
              )

              $teams = $RawTeams -split "[;,]" |
                  ForEach-Object {
                      $_.Trim()
                  } |
                  Where-Object {
                      $_ -ne ""
                  } |
                  Sort-Object -Unique

              if (-not $teams -or $teams.Count -eq 0) {
                  throw "Secret ADO_TEAMS is empty after parsing."
              }

              return $teams
          }

          function Get-TeamIterationsStartingTomorrow {
              param(
                  [string]$Base,
                  [string]$Team,
                  [DateTime]$TomorrowDate
              )

              $encodedTeam = [System.Uri]::EscapeDataString($Team)
              $iterationsUrl = "$Base/$encodedTeam/_apis/work/teamsettings/iterations?api-version=7.1-preview.1"

              $response = Invoke-AdoApi `
                  -Method "GET" `
                  -Url $iterationsUrl

              if (-not $response.value -or $response.value.Count -eq 0) {
                  return @()
              }

              $teamMatches = @()

              foreach ($iteration in $response.value) {
                  if (-not $iteration.attributes -or -not $iteration.attributes.startDate) {
                      continue
                  }

                  $iterationStartDate = [DateTime]$iteration.attributes.startDate

                  if ($iterationStartDate.Date -eq $TomorrowDate.Date) {
                      $teamMatches += [pscustomobject]@{
                          Team      = $Team
                          Path      = $iteration.path
                          StartDate = $iterationStartDate
                      }
                  }
              }

              return $teamMatches
          }

          function Split-IntoChunks {
              param(
                  [int[]]$Ids,
                  [int]$ChunkSize = 200
              )

              $chunks = @()

              for ($i = 0; $i -lt $Ids.Count; $i += $ChunkSize) {
                  $end = [Math]::Min(
                      $i + $ChunkSize - 1,
                      $Ids.Count - 1
                  )

                  $slice = @($Ids[$i..$end])
                  $chunks += ,$slice
              }

              return $chunks
          }

          function Invoke-WorkItemPatch {
              param(
                  [int]$WorkItemId,
                  [object]$PatchBody,
                  [string]$ProjectBase,
                  [string]$OrgBase,
                  [hashtable]$Headers
              )

              $patchUrls = @(
                  "$ProjectBase/_apis/wit/workitems/${WorkItemId}?api-version=7.1",
                  "$OrgBase/_apis/wit/workitems/${WorkItemId}?api-version=7.1"
              )

              $lastError = $null

              foreach ($patchUrl in $patchUrls) {
                  try {
                      Invoke-RestMethod -Method PATCH -Uri $patchUrl -Headers $Headers -ContentType "application/json-patch+json" -Body ($PatchBody | ConvertTo-Json -Depth 20) | Out-Null
                      return
                  }
                  catch {
                      $lastError = $_
                      $statusCode = "unknown"

                      if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                          $statusCode = [int]$_.Exception.Response.StatusCode
                      }

                      Write-Host "Patch attempt failed: URL=$patchUrl | Status=$statusCode | Message=$($_.Exception.Message)"

                      if ($statusCode -ne 404) {
                          throw
                      }
                  }
              }

              throw $lastError
          }

          function Remove-TargetTag {
              param(
                  [string]$TagString,
                  [string]$TargetTag
              )

              if ([string]::IsNullOrWhiteSpace($TagString)) {
                  return @{
                      Changed      = $false
                      NewTagString = ""
                  }
              }

              $sourceTags = $TagString.Split(";") |
                  ForEach-Object { $_.Trim() } |
                  Where-Object { $_ -ne "" }

              $resultTags = @()
              $changed = $false

              foreach ($tag in $sourceTags) {
                  if (
                      $tag.Equals(
                          $TargetTag,
                          [System.StringComparison]::OrdinalIgnoreCase
                      )
                  ) {
                      $changed = $true
                  }
                  else {
                      $resultTags += $tag
                  }
              }

              return @{
                  Changed      = $changed
                  NewTagString = ($resultTags -join "; ")
              }
          }

          $apply = "$env:APPLY_CHANGES".ToLowerInvariant() -eq "true"

          $timeContext = Get-TimeContext -TimezoneId $env:TIMEZONE_ID
          $tomorrowDate = $timeContext.TomorrowDate

          Write-Host "Timezone: $($env:TIMEZONE_ID)"
          Write-Host "Local now: $($timeContext.LocalNow)"
          Write-Host "Target date (tomorrow): $($tomorrowDate.ToString('yyyy-MM-dd'))"
          Write-Host "Apply changes: $apply"

          $orgBase = $env:ADO_ORG.TrimEnd('/')
          $projectBase = "$orgBase/$($env:ADO_PROJECT)"

          $configuredTeams = Get-ConfiguredTeams -RawTeams $env:ADO_TEAMS

          Write-Host "Configured teams:"
          $configuredTeams |
              ForEach-Object {
                  Write-Host "- $_"
              }

          $teamIterations = @()

          foreach ($team in $configuredTeams) {
              Write-Host "Checking iterations for team: $team"

              $teamIterations += Get-TeamIterationsStartingTomorrow `
                  -Base $projectBase `
                  -Team $team `
                  -TomorrowDate $tomorrowDate
          }

          $targetIterations = $teamIterations |
              Sort-Object Path -Unique

          if (-not $targetIterations -or $targetIterations.Count -eq 0) {
              Write-Host "No iterations start tomorrow. Nothing to do."
              exit 0
          }

          Write-Host "Iterations starting tomorrow:"

          $targetIterations |
              ForEach-Object {
                  Write-Host "- Team=$($_.Team) | Path=$($_.Path)"
              }

          $totalWorkItemsScanned = 0
          $totalWorkItemsUpdated = 0
          $totalFailures = 0
          $changeLog = @()

          foreach ($iteration in $targetIterations) {
              $safePath = $iteration.Path.Replace("'", "''")

              $wiqlBody = @{
                  query = @"
          SELECT [System.Id]
          FROM WorkItems
          WHERE [System.TeamProject] = '$($env:ADO_PROJECT)'
          AND [System.IterationPath] = '$safePath'
          "@
              }

              $wiqlUrl = "$projectBase/_apis/wit/wiql?api-version=7.1"

              $wiqlResult = Invoke-AdoApi `
                  -Method "POST" `
                  -Url $wiqlUrl `
                  -Body $wiqlBody

              if (
                  -not $wiqlResult.workItems -or
                  $wiqlResult.workItems.Count -eq 0
              ) {
                  Write-Host "No work items in $($iteration.Path)"
                  continue
              }

              $ids = @(
                  $wiqlResult.workItems |
                      ForEach-Object {
                          [int]$_.id
                      }
              )

              $totalWorkItemsScanned += $ids.Count

              $chunks = Split-IntoChunks `
                  -Ids $ids `
                  -ChunkSize 200

              foreach ($chunk in $chunks) {
                  $batchBody = @{
                      ids = @($chunk)
                      fields = @(
                          "System.Tags"
                          "System.IterationPath"
                          "System.Rev"
                      )
                  }

                  $batchUrl = "$projectBase/_apis/wit/workitemsbatch?api-version=7.1"

                  $batchResult = Invoke-AdoApi `
                      -Method "POST" `
                      -Url $batchUrl `
                      -Body $batchBody

                  foreach ($wi in $batchResult.value) {
                      try {
                          $workItemId = [int]$wi.id
                          $currentTags = ""

                          if ($wi.fields."System.Tags") {
                              $currentTags = [string]$wi.fields."System.Tags"
                          }

                          $tagResult = Remove-TargetTag `
                              -TagString $currentTags `
                              -TargetTag $env:TARGET_TAG

                          if (-not $tagResult.Changed) {
                              continue
                          }

                          $newTags = $tagResult.NewTagString

                          $changeLog += [pscustomobject]@{
                              WorkItemId    = $workItemId
                              IterationPath = $iteration.Path
                              OldTags       = $currentTags
                              NewTags       = $newTags
                              Mode = $(
                                  if ($apply) {
                                      "apply"
                                  }
                                  else {
                                      "dry-run"
                                  }
                              )
                          }

                          if (-not $apply) {
                              continue
                          }

                          $workItemRev = [int]$wi.fields."System.Rev"

                          $patchBody = @(
                              @{
                                  op    = "test"
                                  path  = "/rev"
                                  value = $workItemRev
                              },
                              @{
                                  op    = "add"
                                  path  = "/fields/System.Tags"
                                  value = $newTags
                              }
                          )

                          $basic = [Convert]::ToBase64String(
                              [Text.Encoding]::ASCII.GetBytes(":$env:ADO_PAT")
                          )

                          $headers = @{
                              Authorization = "Basic $basic"
                          }

                          Invoke-WorkItemPatch `
                              -WorkItemId $workItemId `
                              -PatchBody $patchBody `
                              -ProjectBase $projectBase `
                              -OrgBase $orgBase `
                              -Headers $headers

                          $totalWorkItemsUpdated++
                      }
                      catch {
                          $totalFailures++

                          Write-Host "Failed work item id $($wi.id): $($_.Exception.Message)"
                      }
                  }
              }
          }

          Write-Host ""
          Write-Host "Run summary"
          Write-Host "Scanned: $totalWorkItemsScanned"
          Write-Host "Candidates (tag found): $($changeLog.Count)"
          Write-Host "Updated: $totalWorkItemsUpdated"
          Write-Host "Failures: $totalFailures"

          if ($changeLog.Count -gt 0) {
              $json = $changeLog | ConvertTo-Json -Depth 20

              $json |
                  Out-File `
                      -FilePath changes.json `
                      -Encoding utf8

              Write-Host "Saved changes.json"
          }

      - name: Upload change log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ot-tag-cleanup-log
          path: changes.json
          if-no-files-found: ignore
