name: Test - Remove test tag from current iterations

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Apply updates (false = dry run)
        required: true
        type: boolean
        default: false

jobs:
  remove-test-tag-current:
    runs-on: ubuntu-latest
    env:
      ADO_ORG: "${{ secrets.ADO_ORG }}"
      ADO_PROJECT: "${{ secrets.ADO_PROJECT }}"
      ADO_TEAMS: "${{ secrets.ADO_TEAMS }}"
      ADO_PAT: "${{ secrets.ADO_PAT }}"
      TIMEZONE_ID: "${{ secrets.TIMEZONE_ID }}"
    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ADO_ORG)) { throw "Missing secret ADO_ORG" }
          if ([string]::IsNullOrWhiteSpace($env:ADO_PROJECT)) { throw "Missing secret ADO_PROJECT" }
          if ([string]::IsNullOrWhiteSpace($env:ADO_TEAMS)) { throw "Missing secret ADO_TEAMS" }
          if ([string]::IsNullOrWhiteSpace($env:ADO_PAT)) { throw "Missing secret ADO_PAT" }
          if ([string]::IsNullOrWhiteSpace($env:TIMEZONE_ID)) { $env:TIMEZONE_ID = "UTC" }

      - name: Remove test tag from current iterations
        shell: pwsh
        env:
          APPLY_CHANGES: "${{ inputs.apply_changes }}"
        run: |
          $ErrorActionPreference = "Stop"
          $targetTag = "test tag"
          $apply = "$env:APPLY_CHANGES".ToLowerInvariant() -eq "true"

          function Invoke-AdoApi {
              param(
                  [string]$Method,
                  [string]$Url,
                  [object]$Body = $null
              )

              $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$env:ADO_PAT"))
              $headers = @{ Authorization = "Basic $basic" }

              if ($null -ne $Body) {
                  return Invoke-RestMethod -Method $Method -Uri $Url -Headers $headers -ContentType "application/json" -Body ($Body | ConvertTo-Json -Depth 20)
              }

              return Invoke-RestMethod -Method $Method -Uri $Url -Headers $headers
          }

          function Get-TimeContext {
              param([string]$TimezoneId)

              $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById($TimezoneId)
              $nowUtc = [DateTime]::UtcNow
              $localNow = [System.TimeZoneInfo]::ConvertTimeFromUtc($nowUtc, $tz)

              return @{
                  LocalNow = $localNow
                  LocalDate = $localNow.Date
              }
          }

          function Get-ConfiguredTeams {
              param([string]$RawTeams)

              $teams = $RawTeams -split "[;,]" |
                  ForEach-Object { $_.Trim() } |
                  Where-Object { $_ -ne "" } |
                  Sort-Object -Unique

              if (-not $teams -or $teams.Count -eq 0) {
                  throw "Secret ADO_TEAMS is empty after parsing."
              }

              return $teams
          }

          function Get-TeamIterations {
              param(
                  [string]$Base,
                  [string]$Team
              )

              $encodedTeam = [System.Uri]::EscapeDataString($Team)
              $url = "$Base/$encodedTeam/_apis/work/teamsettings/iterations?api-version=7.1-preview.1"
              $response = Invoke-AdoApi -Method "GET" -Url $url

              if (-not $response.value -or $response.value.Count -eq 0) {
                  return @()
              }

              return @(
                  $response.value |
                      Where-Object {
                          $_.attributes -and $_.attributes.startDate -and $_.attributes.finishDate
                      } |
                      ForEach-Object {
                          [pscustomobject]@{
                              Team = $Team
                              Path = $_.path
                              StartDate = [DateTime]$_.attributes.startDate
                              FinishDate = [DateTime]$_.attributes.finishDate
                          }
                      }
              )
          }

          function Get-CurrentIterationsForTeam {
              param(
                  [object[]]$TeamIterations,
                  [DateTime]$LocalDate
              )

              return @(
                  $TeamIterations |
                      Where-Object {
                          $_.StartDate.Date -le $LocalDate.Date -and $_.FinishDate.Date -ge $LocalDate.Date
                      }
              )
          }

          function Remove-TargetTag {
              param(
                  [string]$TagString,
                  [string]$TargetTag
              )

              if ([string]::IsNullOrWhiteSpace($TagString)) {
                  return @{ Changed = $false; NewTagString = "" }
              }

              $sourceTags = $TagString.Split(";") |
                  ForEach-Object { $_.Trim() } |
                  Where-Object { $_ -ne "" }

              $resultTags = @()
              $changed = $false

              foreach ($tag in $sourceTags) {
                  if ($tag.Equals($TargetTag, [System.StringComparison]::OrdinalIgnoreCase)) {
                      $changed = $true
                  }
                  else {
                      $resultTags += $tag
                  }
              }

              return @{ Changed = $changed; NewTagString = ($resultTags -join "; ") }
          }

          function Split-IntoChunks {
              param(
                  [int[]]$Ids,
                  [int]$ChunkSize = 200
              )

              $chunks = @()

              for ($i = 0; $i -lt $Ids.Count; $i += $ChunkSize) {
                  $end = [Math]::Min($i + $ChunkSize - 1, $Ids.Count - 1)
                  $slice = @($Ids[$i..$end])
                  $chunks += ,$slice
              }

              return $chunks
          }

          $base = "$($env:ADO_ORG.TrimEnd('/'))/$($env:ADO_PROJECT)"
          $timeContext = Get-TimeContext -TimezoneId $env:TIMEZONE_ID
          $localDate = $timeContext.LocalDate
          $teams = Get-ConfiguredTeams -RawTeams $env:ADO_TEAMS

          Write-Host "Target tag: $targetTag"
          Write-Host "Timezone: $($env:TIMEZONE_ID)"
          Write-Host "Local now: $($timeContext.LocalNow)"
          Write-Host "Apply changes: $apply"

          $allCurrentIterations = @()

          foreach ($team in $teams) {
              Write-Host "Checking configured iterations for team: $team"
              $teamIterations = Get-TeamIterations -Base $base -Team $team

              if (-not $teamIterations -or $teamIterations.Count -eq 0) {
                  Write-Host "No configured iterations with dates found for team: $team"
                  continue
              }

              $allCurrentIterations += Get-CurrentIterationsForTeam -TeamIterations $teamIterations -LocalDate $localDate
          }

          $targetIterations = $allCurrentIterations | Sort-Object Path -Unique

          if (-not $targetIterations -or $targetIterations.Count -eq 0) {
              Write-Host "No current iterations found for configured teams."
              "[]" | Out-File -FilePath test-tag-current-iteration-removals.json -Encoding utf8
              exit 0
          }

          Write-Host "Current iterations:"
          $targetIterations | ForEach-Object { Write-Host "- Team=$($_.Team) | Path=$($_.Path)" }

          $totalWorkItemsScanned = 0
          $totalWorkItemsUpdated = 0
          $totalFailures = 0
          $changes = @()

          foreach ($iteration in $targetIterations) {
              $safePath = $iteration.Path.Replace("'", "''")
              $wiqlBody = @{
                  query = "SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = '$($env:ADO_PROJECT)' AND [System.IterationPath] = '$safePath'"
              }

              $wiqlUrl = "$base/_apis/wit/wiql?api-version=7.1"
              $wiqlResult = Invoke-AdoApi -Method "POST" -Url $wiqlUrl -Body $wiqlBody

              if (-not $wiqlResult.workItems -or $wiqlResult.workItems.Count -eq 0) {
                  Write-Host "No work items in $($iteration.Path)"
                  continue
              }

              $ids = @($wiqlResult.workItems | ForEach-Object { [int]$_.id })
              $totalWorkItemsScanned += $ids.Count
              $chunks = Split-IntoChunks -Ids $ids -ChunkSize 200

              foreach ($chunk in $chunks) {
                  $batchBody = @{
                      ids = @($chunk)
                      fields = @("System.Title", "System.WorkItemType", "System.State", "System.Tags", "System.IterationPath")
                  }

                  $batchUrl = "$base/_apis/wit/workitemsbatch?api-version=7.1"
                  $batchResult = Invoke-AdoApi -Method "POST" -Url $batchUrl -Body $batchBody

                  foreach ($wi in $batchResult.value) {
                      try {
                          $workItemId = [int]$wi.id
                          $currentTags = ""

                          if ($wi.fields."System.Tags") {
                              $currentTags = [string]$wi.fields."System.Tags"
                          }

                          $tagResult = Remove-TargetTag -TagString $currentTags -TargetTag $targetTag

                          if (-not $tagResult.Changed) {
                              continue
                          }

                          $newTags = $tagResult.NewTagString

                          $change = [pscustomobject]@{
                              WorkItemId = $workItemId
                              Team = $iteration.Team
                              IterationPath = [string]$wi.fields."System.IterationPath"
                              Type = [string]$wi.fields."System.WorkItemType"
                              State = [string]$wi.fields."System.State"
                              Title = [string]$wi.fields."System.Title"
                              OldTags = $currentTags
                              NewTags = $newTags
                              Mode = $(if ($apply) { "apply" } else { "dry-run" })
                          }

                          $changes += $change
                          Write-Host "Tag match: ID=$($change.WorkItemId) | Team=$($change.Team) | Title=$($change.Title)"

                          if (-not $apply) {
                              continue
                          }

                          $detailUrl = "$base/_apis/wit/workitems/$workItemId?api-version=7.1"
                          $detail = Invoke-AdoApi -Method "GET" -Url $detailUrl

                          $patchBody = @(
                              @{ op = "test"; path = "/rev"; value = [int]$detail.rev },
                              @{ op = "add"; path = "/fields/System.Tags"; value = $newTags }
                          )

                          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$env:ADO_PAT"))
                          $headers = @{ Authorization = "Basic $basic" }
                          $patchUrl = "$base/_apis/wit/workitems/$workItemId?api-version=7.1"

                          Invoke-RestMethod -Method PATCH -Uri $patchUrl -Headers $headers -ContentType "application/json-patch+json" -Body ($patchBody | ConvertTo-Json -Depth 20) | Out-Null
                          $totalWorkItemsUpdated++
                      }
                      catch {
                          $totalFailures++
                          Write-Host "Failed work item id $($wi.id): $($_.Exception.Message)"
                      }
                  }
              }
          }

          Write-Host ""
          Write-Host "Run summary"
          Write-Host "Scanned: $totalWorkItemsScanned"
          Write-Host "Candidates (tag found): $($changes.Count)"
          Write-Host "Updated: $totalWorkItemsUpdated"
          Write-Host "Failures: $totalFailures"

          $changes | ConvertTo-Json -Depth 20 | Out-File -FilePath test-tag-current-iteration-removals.json -Encoding utf8
          Write-Host "Saved test-tag-current-iteration-removals.json"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-tag-current-iteration-removals
          path: test-tag-current-iteration-removals.json
          if-no-files-found: error