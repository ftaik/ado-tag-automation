name: ADO quote automation v1 (event-driven)

on:
  repository_dispatch:
    types:
      - ado-work-item-updated
  workflow_dispatch:
    inputs:
      work_item_id:
        description: Work item ID for manual test runs
        required: true
        type: string
      verbose_logs:
        description: Print full incoming event payload for debugging
        required: true
        type: boolean
        default: false

jobs:
  process-work-item:
    runs-on: ubuntu-latest
    concurrency:
      group: ado-quote-${{ github.event.client_payload.resource.workItem.id || github.event.client_payload.resource.workItemId || github.event.client_payload.resource.revision.id || github.event.client_payload.workItemId || github.event.client_payload.work_item_id || github.event.inputs.work_item_id || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read

    env:
      ADO_ORG_URL: ${{ secrets.ADO_ORG_URL }}
      ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
      ADO_PAT: ${{ secrets.ADO_PAT }}
      TEST_EMAIL_OVERRIDE: ${{ secrets.TEST_EMAIL_OVERRIDE }}
      WORK_ITEM_ID: ${{ github.event.inputs.work_item_id }}
      TEST_MODE: "true"
      DRY_RUN: "false"
      VERBOSE_LOGS: ${{ github.event.inputs.verbose_logs }}
      AUTOMATION_ACTORS: dev@shepherd.build,app@shepherd
      MAX_STALE_REV_SCAN: "40"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automation
        run: node scripts/ado-quote-automation.js
