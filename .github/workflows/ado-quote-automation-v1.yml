name: ADO quote automation v1 (event-driven)

on:
  repository_dispatch:
    types:
      - ado-work-item-updated
  workflow_dispatch:
    inputs:
      work_item_id:
        description: Work item ID for manual test runs
        required: true
        type: string
      test_mode:
        description: Force test mode (only tagged test tickets, emails overridden)
        required: true
        type: boolean
        default: true
      dry_run:
        description: Dry run mode (no patching, no emails)
        required: true
        type: boolean
        default: true

jobs:
  process-work-item:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      ADO_ORG_URL: ${{ secrets.ADO_ORG_URL }}
      ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
      ADO_PAT: ${{ secrets.ADO_PAT }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      TEST_EMAIL_OVERRIDE: ${{ secrets.TEST_EMAIL_OVERRIDE }}
      WORK_ITEM_ID: ${{ github.event.inputs.work_item_id }}
      TEST_MODE: ${{ github.event.inputs.test_mode }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automation
        run: node scripts/ado-quote-automation.js
